{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>
<div class="cq-login-wrapper d-flex align-items-center justify-content-center">
    <div class="cq-login-card p-4">
        <h1 class="cq-title text-center mb-3">Reset Password</h1>
        <p class="text-center text-muted mb-4">Enter the code we emailed you, plus your new password.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Reset Code</label>
                <input type="text" name="code" class="cq-input" maxlength="6" placeholder="123456" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="cq-input" placeholder="At least 8 characters" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="cq-input" required>
            </div>
            <button type="submit" class="btn cq-btn w-100">Reset Password</button>
        </form>
    </div>
</div>
</body>
</html>
