{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Verify Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>
<div class="cq-login-wrapper d-flex align-items-center justify-content-center">
    <div class="cq-login-card p-4">
        <h1 class="cq-title text-center mb-3">Verify It's You</h1>
        <p class="text-center text-muted mb-4">
            We emailed a 6-digit code to <strong>{{ email }}</strong>.
            Enter it below to finish logging in.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Verification Code</label>
                <input type="text" name="code" class="cq-input" maxlength="6"
                       placeholder="123456" autofocus required>
            </div>
            <button type="submit" class="btn cq-btn w-100 mb-2">Verify & Log In</button>
        </form>

        <form method="post">
            {% csrf_token %}
            <button type="submit" name="resend" value="1" class="btn btn-link w-100 small">
                Didn't get a code? Resend it
            </button>
        </form>
    </div>
</div>
</body>
</html>
