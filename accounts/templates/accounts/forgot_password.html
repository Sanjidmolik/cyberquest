{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>
<div class="cq-login-wrapper d-flex align-items-center justify-content-center">
    <div class="cq-login-card p-4">
        <h1 class="cq-title text-center mb-3">Forgot Password</h1>
        <p class="text-center text-muted mb-4">Enter your account email — we'll send a reset code.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="cq-input" placeholder="you@gmail.com" required>
            </div>
            <button type="submit" class="btn cq-btn w-100">Send Reset Code</button>
        </form>

        <p class="text-center small mt-4">
            <a href="{% url 'accounts:login' %}" class="cq-signup-link">Back to Login</a>
        </p>
    </div>
</div>
</body>
</html>
