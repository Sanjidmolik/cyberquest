{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Phishing Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'games/css/games.css' %}">
</head>
<body>

<nav class="navbar cq-navbar px-4">
    <a href="{% url 'dashboard:home' %}" class="navbar-brand cq-brand">← CyberQuest</a>
</nav>

<div class="container py-5" style="max-width: 750px;">
    <h1 class="cq-game-title mb-2">📧 Phishing Simulator</h1>
    <p class="text-muted mb-5">
        Read each email carefully. Decide: is it a legitimate message, or a phishing attempt?
    </p>

    <form method="post">
        {% csrf_token %}

        {% for q in questions %}
        <div class="cq-email-card mb-4">
            <div class="cq-email-header">
                <span class="cq-email-label">FROM:</span> {{ q.sender }}
            </div>
            <div class="cq-email-header">
                <span class="cq-email-label">SUBJECT:</span> {{ q.subject }}
            </div>
            <p class="cq-email-body">{{ q.body }}</p>

            <div class="d-flex gap-3 mt-3">
                <label class="cq-choice-pill">
                    <input type="radio" name="question_{{ q.id }}" value="legit" required>
                    <span>✅ Legitimate</span>
                </label>
                <label class="cq-choice-pill cq-choice-danger">
                    <input type="radio" name="question_{{ q.id }}" value="phishing" required>
                    <span>🚩 Phishing</span>
                </label>
            </div>
        </div>
        {% endfor %}

        <button type="submit" class="btn cq-btn w-100 mt-3">Submit Answers</button>
    </form>
</div>

</body>
</html>
