{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ game.title }} — CyberQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'games/css/games.css' %}">
</head>
<body>
<nav class="navbar cq-navbar px-4">
    <a href="{% url 'dashboard:home' %}" class="navbar-brand cq-brand">← CyberQuest</a>
</nav>

<div class="container py-5" style="max-width: 750px;">
    <h1 class="cq-game-title mb-2">{{ game.emoji }} {{ game.title }}</h1>
    <p class="text-muted mb-5">{{ game.intro }}</p>

    <form method="post">
        {% csrf_token %}
        {% for q in questions %}
        <div class="cq-quiz-card mb-4">
            <p class="cq-quiz-prompt">{{ forloop.counter }}. {{ q.prompt|linebreaksbr }}</p>
            {% for option in q.options %}
            <label class="cq-quiz-option">
                <input type="radio" name="question_{{ q.id }}" value="{{ forloop.counter0 }}" required>
                <span>{{ option }}</span>
            </label>
            {% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn cq-btn w-100 mt-3">Submit Answers</button>
    </form>
</div>
</body>
</html>
