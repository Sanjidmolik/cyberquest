{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Password Cracker Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'games/css/games.css' %}">
</head>
<body>

<nav class="navbar cq-navbar px-4">
    <a href="{% url 'pages:home' %}" class="navbar-brand cq-brand" aria-label="CyberQuest home">← CyberQuest</a>
</nav>

<div class="container py-5" style="max-width: 750px;">
    <h1 class="cq-game-title mb-2">🔑 Password Cracker Challenge</h1>
    <p class="text-muted mb-5">
        For each password below, decide how it would hold up against a real attacker:
        Weak, Medium, or Strong.
    </p>

    <form method="post">
        {% csrf_token %}

        {% for q in questions %}
        <div class="cq-email-card mb-4">
            <div class="cq-password-display">{{ q.password }}</div>

            <div class="d-flex gap-3 mt-3 flex-wrap">
                <label class="cq-choice-pill cq-choice-danger">
                    <input type="radio" name="question_{{ q.id }}" value="weak" required>
                    <span>🔴 Weak</span>
                </label>
                <label class="cq-choice-pill cq-choice-medium">
                    <input type="radio" name="question_{{ q.id }}" value="medium" required>
                    <span>🟡 Medium</span>
                </label>
                <label class="cq-choice-pill">
                    <input type="radio" name="question_{{ q.id }}" value="strong" required>
                    <span>🟢 Strong</span>
                </label>
            </div>
        </div>
        {% endfor %}

        <button type="submit" class="btn cq-btn w-100 mt-3">Submit Answers</button>
    </form>
</div>

</body>
</html>
