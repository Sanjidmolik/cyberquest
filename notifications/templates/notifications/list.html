{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberQuest — Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'notifications/css/notifications.css' %}">
</head>
<body>
<nav class="navbar cq-navbar px-4">
    <a href="{% url 'dashboard:home' %}" class="navbar-brand cq-brand">← CyberQuest</a>
</nav>

<div class="container py-5" style="max-width: 700px;">
    <h1 class="cq-heading mb-4">🔔 Notifications</h1>

    {% for n in notifications %}
    <a href="{% url 'notifications:redirect' n.pk %}" class="cq-notif-link">
        <div class="cq-notif-card {% if not n.is_read %}cq-notif-unread{% endif %}">
            <p class="mb-1">{{ n.message }}</p>
            <span class="cq-notif-time">{{ n.created_at|timesince }} ago</span>
        </div>
    </a>
    {% empty %}
    <p class="text-muted">No notifications yet — play a game or finish a course to get started!</p>
    {% endfor %}
</div>
</body>
</html>
