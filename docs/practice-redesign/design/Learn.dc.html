    const P = 'height: 56px; padding: 0 36px; border-radius: 16px; font: 900 17px Nunito, system-ui, sans-serif; letter-spacing: 0.6px; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: 0; box-sizing: border-box; ';
    const btn = (k) => P + ({
      primary: 'background: #7C4DFF; color: #FFFFFF; box-shadow: 0 5px 0 #5B2FE0; cursor: pointer;',
      off: 'background: #E9E5F5; color: #8C84A8; box-shadow: 0 5px 0 #D6D0EA; cursor: not-allowed; pointer-events: none;',
      good: 'background: #0B8A5F; color: #FFFFFF; box-shadow: 0 5px 0 #076B49; cursor: pointer;',
      bad: 'background: #D9480F; color: #FFFFFF; box-shadow: 0 5px 0 #A8360A; cursor: pointer;',
      ghost: 'background: #FFFFFF; color: #5B5277; border: 2px solid #E5DEFF; box-shadow: 0 5px 0 #E5DEFF; cursor: pointer;'
    })[k];
    const MOUTH = { happy: 'M47 70 Q60 81 73 70', wow: 'M55 73 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0', sad: 'M49 77 Q60 69 71 77', think: 'M51 74 L69 72' };
    const sheet = (ok) => ({ sheetBg: ok ? '#DDF7EC' : '#FFE9DC', sheetColor: ok ? '#0B6E50' : '#9A3412', sheetBtn: btn(ok ? 'good' : 'bad'), good: ok, bad: !ok });
    const NB = { bl: 'M92 97 Q103 91 115 95', br: 'M125 95 Q137 91 148 97' };
    const EXP = {
      neutral: Object.assign({}, NB, { m: 'M114 148 Q120 151 126 148', f: 'none', blush: 0.35 }),
      smile: Object.assign({}, NB, { m: 'M112 147 Q120 154 128 147', f: 'none', blush: 0.55 }),
      talk: Object.assign({}, NB, { m: 'M113 147 Q120 155 127 147 Z', f: '#B5434F', blush: 0.45 }),
      think: { bl: 'M92 94 Q103 88 115 93', br: 'M125 97 Q137 95 148 98', m: 'M115 149 L125 148', f: 'none', blush: 0.3 },
      correct: { bl: 'M92 94 Q103 87 115 92', br: 'M125 92 Q137 87 148 94', m: 'M111 145 Q120 158 129 145 Z', f: '#B5434F', blush: 0.75, closed: true },
      happy: { bl: 'M92 94 Q103 87 115 92', br: 'M125 92 Q137 87 148 94', m: 'M111 145 Q120 158 129 145 Z', f: '#B5434F', blush: 0.75, closed: true },
      wrong: { bl: 'M92 96 Q103 95 115 90', br: 'M125 90 Q137 95 148 96', m: 'M113 151 Q120 146 127 151', f: 'none', blush: 0.2 },
      surprised: { bl: 'M92 92 Q103 85 115 90', br: 'M125 90 Q137 85 148 92', m: 'M117 149 a3 4 0 1 0 6 0 a3 4 0 1 0 -6 0', f: '#B5434F', blush: 0.3 }
    };
    const hana = (s) => { const e = EXP[s] || EXP.neutral; return { cls: 'hana ' + s, browL: e.bl, browR: e.br, mouth: e.m, mouthFill: e.f, blush: String(e.blush), open: !e.closed, closed: !!e.closed }; };
    const f = this.state.f;
    const count = f.filter(Boolean).length;
    const all = count === 3;
    const v = {
      progW: this.state.prog + '%', progN: this.state.prog, hearts: 3, revealed: count,
      tip: all ? 'You’ve got the basics. Time to investigate!' : (count ? 'Nice! Keep flipping.' : 'Quick primer first. Tap each card to flip it.'),
      hana: hana(all ? 'happy' : (count ? 'smile' : 'talk')),
      nextStyle: btn(all ? 'primary' : 'off')
    };
    [0, 1, 2].forEach((i) => {
      v['rot' + i] = f[i] ? 'rotateY(180deg)' : 'rotateY(0deg)';
      v['p' + i] = f[i] ? 'true' : 'false';
      v['flip' + i] = () => { const n = f.slice(); n[i] = !n[i]; this.setState({ f: n }); };
    });
    return v;
  }
}
