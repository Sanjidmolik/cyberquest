{# Usage: {% include "dashboard/partials/mission_icon.html" with icon=book.icon %} #}
<svg class="cq-book__emblem" width="96" height="96" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="40" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  {% if icon == "globe" %}
    <circle cx="46" cy="46" r="20"/><ellipse cx="46" cy="46" rx="9" ry="20"/><path d="M26 46h40"/>
    <path d="M64 56l10 4v7c0 6-4 10-10 12-6-2-10-6-10-12v-7z" fill="#fff"/>
  {% elif icon == "mail" %}
    <rect x="26" y="40" width="44" height="30" rx="3"/><path d="M26 42l22 16 22-16"/><path d="M70 18v20a7 7 0 0 1-14 0v-4"/>
  {% elif icon == "key" %}
    <circle cx="38" cy="40" r="11"/><path d="M46 48l24 24M60 62l6-6M66 68l6-6"/>
  {% elif icon == "bug" %}
    <path d="M50 22l22 8v16c0 16-10 26-22 32-12-6-22-16-22-32V30z"/><circle cx="50" cy="52" r="7"/>
    <path d="M50 45v-5M43 52h-6M57 52h6M44 46l-4-4M56 46l4-4M44 58l-4 4M56 58l4 4"/>
  {% elif icon == "wifi" %}
    <path d="M24 46a37 37 0 0 1 52 0M33 56a24 24 0 0 1 34 0M42 65a11 11 0 0 1 16 0"/><circle cx="50" cy="73" r="2" fill="#fff"/>
  {% elif icon == "phone" %}
    <rect x="36" y="22" width="28" height="56" rx="5"/><path d="M46 70h8"/><path d="M50 36l9 4v7c0 6-4 10-9 12-5-2-9-6-9-12v-7z"/>
  {% elif icon == "eye" %}
    <path d="M24 50c8-12 17-18 26-18s18 6 26 18c-8 12-17 18-26 18s-18-6-26-18z"/><circle cx="50" cy="50" r="7"/><path d="M30 72L70 28"/>
  {% elif icon == "siren" %}
    <path d="M34 66V52a16 16 0 0 1 32 0v14z"/><path d="M28 66h44v8H28z"/><path d="M50 22v6M31 30l4 4M69 30l-4 4"/>
  {% else %}
    <rect x="34" y="46" width="32" height="26" rx="4"/><path d="M41 46v-7a9 9 0 0 1 18 0v7"/><circle cx="50" cy="58" r="2" fill="#fff"/>
  {% endif %}
  </g>
</svg>
