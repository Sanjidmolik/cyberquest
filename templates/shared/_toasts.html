{% if messages %}
<div class="cq-toasts" aria-live="polite">
  {% for message in messages %}
  {% if "XP earned" not in message.message and "Level up!" not in message.message and "badge unlocked" not in message.message %}
  <div class="cq-toast cq-toast-{{ message.tags|default:'info' }}" role="status">
    <p>{{ message }}</p>
    <button type="button" class="cq-toast-x" aria-label="Dismiss notification">×</button>
  </div>
  {% endif %}
  {% endfor %}
</div>
{% endif %}
